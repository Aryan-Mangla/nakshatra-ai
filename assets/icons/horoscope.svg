<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="purpleCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B89FFF"/>
      <stop offset="100%" stop-color="#7D5FFF"/>
    </radialGradient>
    <filter id="purpleNeonGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Zodiac Wheel Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#7D5FFF" stroke-width="2" opacity="0.6" filter="url(#purpleNeonGlow)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#9D7FFF" stroke-width="1" stroke-dasharray="5 3" opacity="0.8"/>

  <!-- Wheel Spokes -->
  <g stroke="#7D5FFF" stroke-width="1.2" opacity="0.7" filter="url(#purpleNeonGlow)">
    <line x1="32" y1="6" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="58" y2="32"/>
    <line x1="14" y1="14" x2="19" y2="19"/>
    <line x1="45" y1="45" x2="50" y2="50"/>
    <line x1="50" y1="14" x2="45" y2="19"/>
    <line x1="14" y1="50" x2="19" y2="45"/>
  </g>

  <!-- Inner Concentric Rings -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#7D5FFF" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#9D7FFF" stroke-width="1" opacity="0.4"/>

  <!-- Central Star Sparkle -->
  <path d="M 32,24 Q 32,32 40,32 Q 32,32 32,40 Q 32,32 24,32 Q 32,32 32,24 Z" fill="url(#purpleCenter)" filter="url(#purpleNeonGlow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>

  <!-- Small tick circles on ring -->
  <circle cx="32" cy="6" r="1.5" fill="#B89FFF"/>
  <circle cx="58" cy="32" r="1.5" fill="#B89FFF"/>
  <circle cx="32" cy="58" r="1.5" fill="#B89FFF"/>
  <circle cx="6" cy="32" r="1.5" fill="#B89FFF"/>
</svg>
